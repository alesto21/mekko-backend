name: Backend tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches runtime.txt, so CI runs the same Python Railway does.
          python-version: "3.12.7"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # No secrets required: every outbound call (Vegvesenet, TecDoc,
        # Anthropic, RevenueCat, Discord) is mocked via respx in the test
        # suite - see tests/conftest.py.
        #
        # The Vegvesenet and TecDoc clients read their API key once, at
        # import time, so conftest's fake_api_keys fixture (which patches
        # `settings` later) never reaches them. Locally the real .env
        # supplies a key; in CI there is no .env, the key is empty, and
        # those endpoints return 500. Dummy values here make CI behave
        # like a developer machine. They are never sent anywhere: respx
        # blocks every outbound request.
        env:
          VEGVESENET_API_KEY: ci-dummy-key
          RAPIDAPI_KEY: ci-dummy-key
          ANTHROPIC_API_KEY: ci-dummy-key
        run: pytest -v
